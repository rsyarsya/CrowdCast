# Production stack for one VM: PostgreSQL, the API, and Caddy for HTTPS.
#   cp .env.example .env   (fill in the values)
#   docker compose up -d --build
name: crowdcast

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crowdcast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: crowdcast
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdcast -d crowdcast"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    image: crowdcast-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://crowdcast:${POSTGRES_PASSWORD}@db:5432/crowdcast
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      WORKER_API_KEY: ${WORKER_API_KEY:?set WORKER_API_KEY in deploy/.env}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?set BACKEND_CORS_ORIGINS in deploy/.env}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-}
      FORWARDED_ALLOW_IPS: "*"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
