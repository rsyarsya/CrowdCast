name: CrowdCast CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  repository-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          echo "Checking CrowdCast repository..."
          test -f README.md
          test -f docs/index.md
          echo "Repository structure check passed."

      - name: Check unresolved merge conflicts
        run: |
          if grep -R -n \
            --exclude-dir=.git \
            -e '^<<<<<<< ' \
            -e '^=======$' \
            -e '^>>>>>>> ' .; then
            echo "Unresolved merge conflict found."
            exit 1
          else
            echo "No unresolved merge conflicts found."
          fi

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crowdcast
          POSTGRES_PASSWORD: crowdcast
          POSTGRES_DB: crowdcast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crowdcast -d crowdcast_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://crowdcast:crowdcast@localhost:5432/crowdcast_test
      SECRET_KEY: ci-test-secret-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t crowdcast-api:ci backend

      - name: Check image starts and imports the app
        run: docker run --rm --entrypoint python -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x -e SECRET_KEY=ci crowdcast-api:ci -c "import app.main"

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
